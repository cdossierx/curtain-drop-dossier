# Render Blueprint for Curtain Drop Dossier
# 
# HOW TO USE:
# 1. Push this repo to GitHub
# 2. Go to dashboard.render.com → Click "Blueprints" → "New Blueprint Instance"
# 3. Connect your GitHub repo
# 4. Render reads this file and sets up everything automatically
# 5. Go to your service → Environment → add the secret values marked "sync: false"
# 6. Your app will be live at the URL Render provides

services:
  - type: web
    name: curtain-drop-dossier
    runtime: node
    plan: starter        # Change to "standard" ($7/mo) for no cold starts
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Render auto-assigns PORT — do not set manually
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
      # SECRETS — add these in Render dashboard after first deploy:
      - key: DATABASE_URL
        sync: false
      - key: APP_ID
        sync: false
      - key: APP_SECRET
        sync: false
      - key: KIMI_AUTH_URL
        sync: false
      - key: KIMI_OPEN_URL
        sync: false
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 2
